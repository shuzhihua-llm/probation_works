syntax = "proto3";

package school;

enum Gender {
    UNKNOWN = 0;
    MALE = 1;
    FEMALE = 2;
}

message Address {
    string city = 1;
    string street = 2;
    string zip_code = 3;
}

message Student {
    int32 id = 1;
    string name = 2;
    int32 age = 3;
    string email = 4;
    Gender gender = 5;
    Address address = 6;
    repeated string courses = 7;
    
    map<string, int32> scores = 8;
    
    oneof contact {
        string phone = 9;
        string wechat = 10;
    }
}